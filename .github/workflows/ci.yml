name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Project state check
        run: npm run state:check

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e --workspace @22void/web

  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: void
          POSTGRES_PASSWORD: void_dev_password
          POSTGRES_DB: 22void
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U void -d 22void"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://void:void_dev_password@localhost:5432/22void
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy

      - name: CRUD integration tests
        run: npm run db:test

  security:
    runs-on: ubuntu-latest
    steps:
      # Full history: the history scan walks `git rev-list --all`, and the default
      # shallow checkout would hide every commit except the tip from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scanner self-test
        run: npm run security:scan:test

      - name: Secret scan (tracked and untracked non-ignored files)
        run: npm run security:scan

      - name: Secret scan (published git history)
        run: npm run security:scan:history

      - name: Dependency audit (production tree)
        run: npm run audit:prod

      - name: Dependency audit (full tree)
        run: npm run audit

  deployment-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install validation tooling
        run: npm ci

      - name: Generate production validation environment
        run: |
          set -euo pipefail
          cp infra/env.prod.example infra/.env.prod
          postgres_password="$(openssl rand -hex 24)"
          api_key="$(openssl rand -hex 32)"
          admin_api_key="$(openssl rand -hex 32)"
          odds_api_key="$(openssl rand -hex 32)"
          sed -i \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${postgres_password}|" \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:${postgres_password}@db:5432/void|" \
            -e "s|^API_KEY=.*|API_KEY=${api_key}|" \
            -e "s|^ADMIN_API_KEY=.*|ADMIN_API_KEY=${admin_api_key}|" \
            -e "s|^WORKER_PROVIDER=.*|WORKER_PROVIDER=mock|" \
            -e "s|^ODDS_API_KEY=.*|ODDS_API_KEY=${odds_api_key}|" \
            -e "s|^ODDS_API_BASE_URL=.*|ODDS_API_BASE_URL=|" \
            -e "s|^SCANNER_POLL_INTERVAL_MS=.*|SCANNER_POLL_INTERVAL_MS=1000|" \
            -e "s|^DOMAIN=.*|DOMAIN=|" \
            -e "s|^ACME_EMAIL=.*|ACME_EMAIL=|" \
            infra/.env.prod
          chmod 600 infra/.env.prod

      - name: Validate production compose configuration
        run: npm run compose:prod:config

      - name: Build and start production stack
        run: docker compose --env-file infra/.env.prod -f infra/compose.prod.yml up --detach --build

      - name: Wait for web and worker health
        run: |
          set -euo pipefail
          compose=(docker compose --env-file infra/.env.prod -f infra/compose.prod.yml)
          for service in web worker; do
            container_id="$("${compose[@]}" ps --quiet "$service")"
            test -n "$container_id"
            for attempt in $(seq 1 90); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                break
              fi
              if [ "$health" = "unhealthy" ] || [ "$health" = "exited" ] || [ "$health" = "dead" ]; then
                echo "::error::$service entered state $health"
                exit 1
              fi
              sleep 2
            done
            if [ "${health:-}" != "healthy" ]; then
              echo "::error::Timed out waiting for $service health"
              exit 1
            fi
          done

      - name: Wait for and verify latest backup
        run: |
          set -euo pipefail
          compose=(docker compose --env-file infra/.env.prod -f infra/compose.prod.yml)
          backup_ready=false
          for attempt in $(seq 1 60); do
            container_id="$("${compose[@]}" ps --quiet backup)"
            state="$(docker inspect --format '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
            if [ "$state" = "running" ]; then
              if "${compose[@]}" exec -T backup sh -c 'grep -q "^OK " /backups/status && set -- /backups/void-*.dump && test -s "$1"'; then
                backup_ready=true
                break
              fi
            fi
            sleep 2
          done
          if [ "$backup_ready" != "true" ]; then
            echo "::error::Timed out waiting for a successful backup"
            exit 1
          fi
          latest="$("${compose[@]}" exec -T backup sh -c 'ls -1t /backups/void-*.dump | head -n 1')"
          "${compose[@]}" exec -T backup sh -c 'test -s "$1" && ls -lh "$1" && sha256sum "$1" && test -n "$(pg_restore --list "$1")"' sh "$latest"

      - name: Run production smoke with x-api-key and scanner required
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/smoke-x-api-key.mjs" <<'EOF'
          const originalFetch = globalThis.fetch;
          globalThis.fetch = (input, init = {}) => {
            const headers = new Headers(init.headers);
            const authorization = headers.get("authorization");
            if (authorization?.startsWith("Bearer ")) {
              headers.set("x-api-key", authorization.slice(7));
              headers.delete("authorization");
            }
            return originalFetch(input, { ...init, headers });
          };
          EOF
          smoke_passed=false
          for attempt in $(seq 1 30); do
            if SMOKE_BASE_URL=http://127.0.0.1:3000 \
              SMOKE_API_KEY="$(sed -n 's/^API_KEY=//p' infra/.env.prod)" \
              SMOKE_REQUIRE_SCANNER=true \
              NODE_OPTIONS="--import=$RUNNER_TEMP/smoke-x-api-key.mjs" \
              npm run smoke:prod; then
              smoke_passed=true
              break
            fi
            sleep 2
          done
          test "$smoke_passed" = "true"

      - name: Show deployment logs on failure
        if: failure()
        run: |
          docker compose --env-file infra/.env.prod -f infra/compose.prod.yml ps
          docker compose --env-file infra/.env.prod -f infra/compose.prod.yml logs --no-color --tail=200

      - name: Tear down production stack
        if: always()
        run: |
          docker compose --env-file infra/.env.prod -f infra/compose.prod.yml down --volumes --remove-orphans
          rm -f infra/.env.prod
