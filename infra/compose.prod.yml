name: 22void-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-55432}:5432"
    networks:
      - backend

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVICE_ROLE: migrate
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/.env.prod}
    command: ["/usr/local/bin/migrate.sh"]
    networks:
      - backend

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SERVICE_ROLE: web
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/.env.prod}
      DASHBOARD_SOURCE: ${DASHBOARD_SOURCE:-db}
      API_KEY: ${API_KEY:?set API_KEY in infra/.env.prod}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in infra/.env.prod}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "/usr/local/bin/health-check.mjs",
          "http://127.0.0.1:3000/api/v1/health",
          "ok",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - backend

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SERVICE_ROLE: worker
      NODE_ENV: production
      WORKER_PROVIDER: ${WORKER_PROVIDER:-odds-api}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_API_BASE_URL: ${ODDS_API_BASE_URL:-https://api.the-odds-api.com}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in infra/.env.prod}
      SCANNER_POLL_INTERVAL_MS: ${SCANNER_POLL_INTERVAL_MS:-15000}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-10}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-5}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8081}
      WORKER_STALENESS_MS: ${WORKER_STALENESS_MS:-300000}
    healthcheck:
      test:
        ["CMD", "node", "/usr/local/bin/health-check.mjs", "http://127.0.0.1:8081/healthz", "ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend

  backup:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env.prod}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env.prod}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env.prod}
      BACKUP_DIR: /backups
      BACKUP_STATUS_FILE: /backups/status
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-129600}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_REQUIRE_OFFHOST: ${BACKUP_REQUIRE_OFFHOST:-false}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-void/backups}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SSE: ${S3_SSE:-AES256}
      S3_SSE_KMS_KEY_ID: ${S3_SSE_KMS_KEY_ID:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-health.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
